<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a1e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Sunset Key</title>
<style>
/* HUD: minimap + place name top left, clock top right, speedometer / touch pad bottom right. One dark neon look by choice. */
:root{--bg:#120a1e;--ink:#ffeaf6;--dim:#c7a8d8;--pink:#ff4fa0;--cyan:#3df0ff;--amber:#ffb02e;--panel:rgba(22,10,38,.5);--line:rgba(255,160,220,.26);--disp:'Righteous','Trebuchet MS',system-ui,sans-serif;--body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ml:max(16px,env(safe-area-inset-left,0px));--mr:max(16px,env(safe-area-inset-right,0px));--mt:calc(16px + env(safe-area-inset-top,0px));--mb:calc(18px + env(safe-area-inset-bottom,0px));color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg);touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 66%,rgba(18,6,34,.22) 100%)}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* shared compact pill look */
#place,#clock,#cash,#stars,#wpn,#hp,#ar,#mission,#hint,#speed,#prompt{background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* top left: minimap, place, quality gear */
#hudL{position:fixed;left:var(--ml);top:var(--mt);display:none;flex-direction:column;align-items:flex-start;gap:5px;pointer-events:none}
body.playing #hudL{display:flex}
#mapw{position:relative}
#map{display:block;width:96px;height:96px;border-radius:50%;background:rgba(22,10,38,.5);box-shadow:0 0 0 2px rgba(18,6,34,.7),0 0 12px rgba(255,79,160,.4),0 4px 14px rgba(0,0,0,.4)}
#bQual{pointer-events:auto;cursor:pointer;position:absolute;right:-6px;bottom:-2px;width:22px;height:22px;margin:0;padding:0;border-radius:50%;border:1px solid var(--line);background:rgba(22,10,38,.6);color:var(--dim);font:400 13px/20px var(--body);text-align:center;opacity:.7}
#bQual:hover{color:var(--ink);border-color:var(--cyan);opacity:1}
#place{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 8px;border-radius:99px;font:400 10px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
#place i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
/* top right: clock, cash, wanted stars in one slim column */
#hudR{position:fixed;right:var(--mr);top:var(--mt);display:none;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
body.playing #hudR{display:flex}
#clock{display:flex;align-items:baseline;gap:7px;padding:5px 10px;border-radius:10px;font:400 16px/1 var(--disp);letter-spacing:.06em;font-variant-numeric:tabular-nums}
#clock small{font:600 9px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
#cash{display:flex;align-items:baseline;gap:4px;padding:4px 10px;border-radius:10px}
#cash span{font:400 12px/1 var(--disp);color:#7dff9d}
#cash b{font:400 15px/1 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.04em}
#cash.pop{animation:cpop .5s}
@keyframes cpop{30%{transform:scale(1.12);border-color:#7dff9d}}
#stars{display:flex;gap:1px;padding:3px 8px;border-radius:99px}
#stars.hide{display:none}
#stars b{font:400 14px/1 var(--body);color:rgba(255,255,255,.2)}
#stars b.on{color:#ffd34a;text-shadow:0 0 8px rgba(255,200,60,.7)}
#stars.chase b.on{animation:blink .5s steps(2) infinite}
#stars.chase{border-color:rgba(255,80,100,.8)}
@keyframes blink{50%{color:#ff4a5a;text-shadow:0 0 10px #ff2a40}}
/* toast, hint, prompt */
#toast{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100vw - 32px);top:calc(var(--mt) + 2px);padding:7px 14px;font:400 12px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);animation:tin .25s ease-out;pointer-events:none}
#toast b{color:var(--pink);font-weight:400}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#hint{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100vw - 32px);bottom:var(--mb);padding:6px 12px;border-radius:99px;font-size:11px;line-height:1.5;color:var(--dim);text-align:center;transition:opacity .6s;pointer-events:none}
kbd{display:inline-block;min-width:16px;text-align:center;margin:0 2px;padding:1px 5px;border-radius:4px;border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;background:rgba(255,255,255,.1);color:var(--ink);font:700 10px/1.3 var(--body)}
#prompt{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:calc(var(--mb) + 40px);display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:99px;border-color:rgba(61,240,255,.55);font:600 12px/1 var(--body);color:var(--ink);pointer-events:none}
#prompt kbd{background:var(--cyan);border-color:#b9fbff;color:#0b1d26;font-size:12px;padding:2px 7px;margin:0}
/* mission */
#mission{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;max-width:calc(100vw - 32px);top:calc(var(--mt) + 34px);display:flex;align-items:center;gap:10px;padding:5px 11px;border-radius:10px;pointer-events:none;border-left:3px solid var(--amber)}
#mission[hidden]{display:none!important}
#mission[data-t=hunt]{border-left-color:#ff4a5a}
#mission[data-t=race]{border-left-color:var(--cyan)}
#mTitle{font:400 10px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
#mText{font:500 11px/1.2 var(--body);color:var(--dim)}
#mTime{font:400 14px/1 var(--disp);font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink)}
#mTime.low{color:#ff6a78;animation:blink2 .6s steps(2) infinite}
@keyframes blink2{50%{opacity:.35}}
/* bottom left: weapon + health, tight */
#hudB{position:fixed;left:var(--ml);bottom:var(--mb);display:none;flex-direction:column;gap:3px;width:150px;pointer-events:none}
body.playing #hudB{display:flex}
#wpn{position:relative;padding:6px 10px 7px;border-radius:10px}
#wSlots{display:none}
#wRow{display:flex;align-items:baseline;gap:8px;flex-wrap:nowrap}
#wName{font:400 10px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;color:var(--dim)}
#wGr{display:flex;align-items:center;gap:3px;font:400 10px/1 var(--disp);color:var(--dim);margin-right:auto}
#wGr i{width:7px;height:7px;border-radius:50%;background:#8fd36a;box-shadow:0 0 5px rgba(143,211,106,.7)}
#wAmmo{font:400 19px/1 var(--disp);font-variant-numeric:tabular-nums;color:var(--amber);white-space:nowrap}
#wAmmo small{font:600 10px/1 var(--body);color:var(--dim);margin-left:3px}
#wAmmo.empty{color:#ff4a5a}
#wRelBar{display:none;height:2px;margin-top:5px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
#wpn.rel #wRelBar{display:block}
#wRel{display:block;height:100%;width:0;background:var(--cyan)}
#hp{display:flex;align-items:center;gap:7px;padding:4px 9px;border-radius:99px}
#hp u{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
#hp s{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#3dff9a,#a6ff5a);transition:width .15s}
#hp b{font:400 11px/1 var(--disp);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
#hp.low s{background:linear-gradient(90deg,#ff3b4a,#ff7a3b)}
#hp.low b{color:#ff6a78}
#ar{display:none;padding:3px 9px;border-radius:99px}
#ar.on{display:block}
#ar u{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
#ar s{display:block;height:100%;width:0;background:linear-gradient(90deg,#4a8bff,#8fd0ff)}
/* bottom right: speedometer */
#speed{position:fixed;right:var(--mr);bottom:var(--mb);display:flex;align-items:baseline;flex-wrap:wrap;gap:5px;width:112px;padding:6px 10px 8px;border-radius:10px}
#speed b{font:400 28px/1 var(--disp);letter-spacing:.03em;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
#speed small{font:600 9px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#speed u{display:block;flex:0 0 100%;height:4px;margin-top:5px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#speed .hpu{height:3px;margin-top:3px}
#speed .hpu s{background:linear-gradient(90deg,#ff3b4a,#ffb02e 60%,#5dff9a);width:100%}
#speed .nit{height:3px;margin-top:3px}
#speed .nit s{background:linear-gradient(90deg,#2a6bff,#8fd0ff);width:100%}
#speed s{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--pink) 70%,var(--amber))}
/* crosshair + screen effects */
#xhair{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .15s}
#xhair.show{opacity:.85}
#xhair i{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.8);box-shadow:0 0 5px rgba(0,0,0,.6);transform:scale(var(--bs,1))}
#xhair i::after{content:'';position:absolute;left:8px;top:8px;width:4px;height:4px;border-radius:50%;background:#ff4fa0}
#xhair.rel i{border-color:var(--cyan);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:scale(var(--bs,1)) rotate(360deg)}}
#hitm{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;opacity:0;background:linear-gradient(45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%),linear-gradient(-45deg,transparent 45%,#fff 45%,#fff 55%,transparent 55%);filter:drop-shadow(0 0 3px #f23)}
#hitm.show{opacity:.95}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(255,20,40,.75) 100%)}
#wasted{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;background:rgba(20,0,10,.45)}
#wasted.show{display:flex}
#wasted b{font:400 clamp(40px,11vw,84px)/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:#ff3b4a;text-shadow:0 0 24px rgba(255,40,70,.7)}
#wasted small{font:600 12px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
/* touch controls: smaller, see-through, icon-only for the minor buttons */
#stick{position:fixed;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.02));pointer-events:none;display:none}
#stick u{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9fcf,var(--pink));box-shadow:0 0 12px rgba(255,79,160,.5);opacity:.85}
#pad{position:fixed;right:var(--mr);bottom:calc(var(--mb) + 4px);display:none;gap:7px;grid-template-columns:repeat(5,auto);grid-template-areas:'l g w a r' '. . f f j';justify-items:center;align-items:center}
body.touch.playing #pad{display:grid}
#bRel,#bNitro{grid-area:l}#bGren{grid-area:g}#bWeap{grid-area:w}#bAct{grid-area:a}#bRun{grid-area:r}#bFire{grid-area:f}#bJump{grid-area:j}
#pad button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:42px;height:42px;padding:0;border-radius:50%;font:400 8px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:rgba(22,10,38,.4);border:1.5px solid var(--line);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);touch-action:none}
#pad button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#pad #bNitro span,#pad #bRel span,#pad #bGren span,#pad #bWeap span,#pad #bRun span,#pad #bAct span{display:none}
#pad #bFire{width:70px;height:70px;border-color:rgba(255,60,80,.8);color:#ffd6dc}
#pad #bFire svg,#pad #bJump svg{width:26px;height:26px}
#pad #bJump{width:56px;height:56px;border-color:rgba(255,79,160,.65)}
#bFire,#bWeap,#bRel,#bGren,#bAct,#bNitro{display:none!important}
body.touch #pad #bNitro.show{display:flex!important;border-color:rgba(61,180,255,.8);color:#aee0ff}
body.touch #pad #bFire.show,body.touch #pad #bWeap.show,body.touch #pad #bRel.show,body.touch #pad #bGren.show{display:flex!important}
#pad button.on{background:var(--pink);color:#1a0a24;border-color:#ffd0ea}
body.touch #pad #bAct.show{display:flex!important;border-color:rgba(61,240,255,.75)}
body.touch #prompt{display:none}
body.touch #hint{bottom:calc(var(--mb) + 120px)}
body.touch #speed{bottom:calc(var(--mb) + 118px)}
body:not(.armed) #wpn{display:none}
body.touch #hudB{width:128px}
body.touch #wAmmo{font-size:17px}
#fail{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg)}
#fail h2{font:400 28px var(--disp);margin:0 0 8px}
#fail p{margin:0;color:var(--dim);max-width:34ch}
/* small screens */
@media (max-width:560px){#map{width:72px;height:72px}#place{display:none}#clock{font-size:14px;padding:4px 8px}#mission{top:calc(var(--mt) + 78px);max-width:calc(100vw - 32px);gap:7px}#hint{font-size:10px}#speed{width:100px}#speed b{font-size:24px;min-width:40px}}
@media (max-height:430px){#map{width:60px;height:60px}#place,#hint{display:none}#mission{top:var(--mt);left:calc(var(--ml) + 76px);right:auto;margin:0}#pad #bFire{width:58px;height:58px}#pad #bJump{width:46px;height:46px}#pad button{width:36px;height:36px}#hudB{width:116px}body.touch #speed{bottom:calc(var(--mb) + 100px)}#toast{top:calc(var(--mt) + 26px)}}
@media (prefers-reduced-motion:reduce){#hint{transition:none}#toast{animation:none}}

/* menu overlay */
body.paused #hudL,body.paused #hudR,body.paused #hudB,body.paused #hint,body.paused #speed,body.paused #pad,body.paused #mission,body.paused #xhair,body.paused #hitm,body.paused #prompt,body.paused #stick{display:none!important}
#toast{z-index:60}
#menu{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;overflow-y:auto;justify-content:center;padding:12px;background:rgba(12,5,24,.7);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);touch-action:pan-y}
#menu[hidden]{display:none!important}
#mpanel{width:min(470px,100%);margin:auto;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;padding:16px 18px 18px;border-radius:16px;background:rgba(26,12,44,.92);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5);touch-action:pan-y;-webkit-user-select:none;user-select:none}
#mpanel.map{width:auto;max-width:100%}
#mpanel h2{margin:0 0 12px;font:400 22px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase}
#mpanel h3{margin:0 0 8px;font:400 11px/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
#mpanel section{margin:0 0 14px;padding:12px 0 0;border-top:1px solid rgba(255,160,220,.16)}
#mpanel label{display:flex;justify-content:space-between;margin:8px 0 5px;font:600 11px/1 var(--body);letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
#mpanel label b{color:var(--ink);font-variant-numeric:tabular-nums}
#mpanel button{cursor:pointer;margin:0;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:600 12px/1 var(--body);touch-action:manipulation}
#mpanel button:hover:not(:disabled){border-color:var(--cyan)}
#mpanel button.on{background:var(--cyan);color:#0b1d26;border-color:#b9fbff}
#mpanel button:disabled{opacity:.35;cursor:default}
#mpanel .big{flex:1;padding:12px;background:var(--pink);color:#1a0a24;border-color:#ffd0ea;font:400 14px/1 var(--disp);letter-spacing:.1em;text-transform:uppercase}
#mpanel .danger{flex:1;color:#ff8a96;border-color:rgba(255,90,110,.5)}
.mrow{display:flex;gap:8px;margin-bottom:12px}
.mrow button:not(.big){flex:0 0 auto}
.seg{display:flex;gap:5px}.seg button{flex:1;padding:8px 4px}
.mline{display:flex;gap:10px;align-items:center}
.mline input{flex:1;min-width:0}
#mpanel input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:rgba(255,255,255,.18);outline:none;touch-action:none}
#mpanel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--pink);border:2px solid #fff;cursor:pointer}
#mpanel input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--pink);border:2px solid #fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats span{display:flex;flex-direction:column;gap:4px;font:600 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stats b{font:400 16px/1 var(--disp);color:var(--ink);letter-spacing:.04em}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;font-size:12px;color:var(--dim)}
.keys kbd{margin-left:0}
.cashline{margin:-4px 0 12px;font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.cashline b{font:400 18px/1 var(--disp);color:#7dff9d;margin-left:6px}
.items{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,160,220,.14)}
.item b{display:block;font:600 13px/1.2 var(--body)}
.item small{display:block;margin-top:3px;font-size:11px;color:var(--dim)}
.item button{flex:0 0 auto;min-width:74px;background:rgba(125,255,157,.14);border-color:rgba(125,255,157,.5);color:#bfffd0}
.maphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.maphead h2{margin:0}
#bigmap{display:block;margin:0 auto;border-radius:10px;border:1px solid var(--line);cursor:crosshair;touch-action:manipulation}

.maphint{margin-top:8px;text-align:center;font-size:11px;color:var(--dim)}
@media (max-width:560px){.keys{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
#map{touch-action:manipulation}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.ach div{display:flex;flex-direction:column;gap:3px;padding:7px 9px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);opacity:.55}
.ach div.got{opacity:1;border-color:rgba(255,200,80,.45);background:rgba(255,200,80,.08)}
.ach b{font:600 12px/1.1 var(--body);color:var(--ink)}
.ach div.got b{color:#ffd34a}
.ach span{font:400 10px/1.2 var(--body);color:var(--dim)}
h3 small{font-size:10px;color:var(--dim);letter-spacing:.08em;margin-left:6px}
@media (max-width:420px){.ach{grid-template-columns:1fr}}
#fpsChip{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 6px);z-index:7;font:600 11px/1 var(--body);letter-spacing:.04em;color:#bff;background:rgba(10,8,24,.62);padding:5px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.14);pointer-events:none;display:none;white-space:nowrap}
body.showfps #fpsChip{display:block}
body.paused #fpsChip{display:none}
/* story dialogue + properties */
#mission[data-t=story]{border-left-color:#b46eff}
#mpanel.dlg{width:min(540px,100%);margin:auto auto 5vh;background:rgba(22,10,40,.95);border-color:rgba(190,120,255,.5)}
#mpanel .dlgwho{display:inline-block;margin:2px 0 8px;padding:5px 11px;border-radius:7px;background:#b46eff;color:#1a0a24;font:400 13px/1 var(--disp);letter-spacing:.12em;text-transform:uppercase}
#mpanel .dlgwho.me{background:var(--cyan)}
#mpanel .dlgtxt{margin:0 0 14px;font:500 16px/1.45 var(--body);color:var(--ink);min-height:70px}
#mpanel .dlgi{align-self:center;font:600 11px/1 var(--body);color:var(--dim);letter-spacing:.1em}
#mpanel .mrow{align-items:stretch}
